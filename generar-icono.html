<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador del ícono de Dato</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F7F7F8;color:#111;min-height:100vh;display:grid;place-items:center;padding:24px}
.card{background:#fff;border:.5px solid rgba(60,60,67,.15);border-radius:18px;padding:28px 24px;max-width:420px;width:100%;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
h1{font-size:22px;letter-spacing:-.02em}
p{font-size:14px;color:#555;line-height:1.5}
canvas{width:180px;height:180px;border-radius:40px;border:.5px solid rgba(60,60,67,.2)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
button{background:#007AFF;color:#fff;border:0;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer}
button.sec{background:#EEF0F3;color:#111}
small{font-size:12px;color:#777}
</style>
</head>
<body>
<div class="card">
  <h1>Ícono de Dato</h1>
  <canvas id="prev" width="360" height="360"></canvas>
  <p>Descarga <b>icon-180.png</b> y súbelo a tu repositorio de GitHub junto con <b>index.html</b>. El iPhone le pone las esquinas redondeadas solo.</p>
  <div class="row">
    <button id="b180">Descargar icon-180.png</button>
    <button id="b512" class="sec">icon-512.png</button>
  </div>
  <small>El ícono tiene fondo blanco, sin transparencias ni esquinas, como pide iOS.</small>
</div>
<script>
function draw(canvas,size){
  canvas.width=size;canvas.height=size;
  const c=canvas.getContext('2d'),k=size/120;
  c.fillStyle='#FFFFFF';c.fillRect(0,0,size,size);
  c.lineCap='round';c.lineJoin='round';
  c.strokeStyle='#34C759';c.lineWidth=9*k;
  c.beginPath();c.moveTo(16*k,94*k);c.lineTo(43*k,70*k);c.lineTo(73*k,78*k);c.lineTo(104*k,24*k);c.stroke();
  const dot=(x,y,r,col)=>{c.fillStyle=col;c.beginPath();c.arc(x*k,y*k,r*k,0,Math.PI*2);c.fill();};
  dot(16,94,8,'#FFCC00');dot(43,70,8,'#FF9500');dot(104,24,14,'#007AFF');
}
function download(size,name){
  const cv=document.createElement('canvas');draw(cv,size);
  cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);},'image/png');
}
draw(document.getElementById('prev'),360);
document.getElementById('b180').onclick=()=>download(180,'icon-180.png');
document.getElementById('b512').onclick=()=>download(512,'icon-512.png');
</script>
</body>
</html>
