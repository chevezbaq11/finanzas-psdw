<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F2F2F7;--surface:#FFFFFF;--surface-2:#FFFFFF;--surface-3:#F2F2F7;
  --line:rgba(60,60,67,0.10);--separator:rgba(60,60,67,0.20);
  --fill-quaternary:rgba(120,120,128,0.06);--fill-tertiary:rgba(120,120,128,0.10);
  --fill-secondary:rgba(120,120,128,0.16);
  --text:#000000;--text-2:rgba(60,60,67,0.72);--text-3:rgba(60,60,67,0.48);
  --muted:rgba(60,60,67,0.60);--primary:#007AFF;--primary-2:#5856D6;
  --green:#34C759;--green-text:#248A3D;--red:#FF3B30;--red-text:#D70015;
  --amber:#FF9500;--amber-text:#B25000;--blue:#007AFF;--purple:#AF52DE;
  --teal:#00C7BE;--indigo:#5856D6;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.03);
  --shadow-md:0 4px 16px rgba(0,0,0,0.06);
  --shadow-lg:0 20px 40px rgba(0,0,0,0.10);
  --fs-xs:12px;--fs-sm:14px;--fs-base:16px;--fs-lg:20px;--fs-xl:24px;--fs-2xl:32px;--fs-3xl:40px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-10:40px;
  --r-sm:8px;--r-md:12px;--r-lg:20px;--r-full:9999px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);--safe-right:env(safe-area-inset-right,0px);
  --nav-h:calc(58px + var(--safe-bottom));
  --cc-w:280px;--cc-h:168px;
  --chart-font:11px;--chart-h-sm:240px;--chart-h-md:340px;--chart-h-lg:420px;
}
body.dark{
  --bg:#000000;--surface:#1C1C1E;--surface-2:#1C1C1E;--surface-3:#2C2C2E;
  --line:rgba(84,84,88,0.32);--separator:rgba(84,84,88,0.55);
  --fill-quaternary:rgba(118,118,128,0.12);--fill-tertiary:rgba(118,118,128,0.18);
  --fill-secondary:rgba(118,118,128,0.26);
  --text:#FFFFFF;--text-2:rgba(235,235,245,0.70);--text-3:rgba(235,235,245,0.44);
  --muted:rgba(235,235,245,0.60);
  --green-text:#30D158;--red-text:#FF453A;--amber-text:#FF9F0A;
}
html{-webkit-text-size-adjust:100%}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-0.011em;line-height:1.4;min-height:100vh;padding-left:var(--safe-left);padding-right:var(--safe-right);font-weight:400;font-size:var(--fs-sm);font-feature-settings:"tnum" 1,"ss01" 1}
body.modal-open{overflow:hidden}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit;font-weight:400}
button{cursor:pointer;border:0;background:none;min-width:0;letter-spacing:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--r-sm)}
svg{display:block;background:transparent}
input:not([type="checkbox"]):not([type="radio"]),select,textarea{-webkit-appearance:none;appearance:none;font-size:16px!important}
input[type="checkbox"],input[type="radio"]{-webkit-appearance:auto!important;appearance:auto!important;box-sizing:content-box;width:16px;height:16px;padding:0!important;margin:0!important;accent-color:var(--primary);cursor:pointer}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.sidebar{background:var(--surface);border-right:.5px solid var(--separator);padding:var(--sp-3) var(--sp-2);position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-3) var(--sp-5)}
.brand__logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-2));display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none;box-shadow:0 1px 3px rgba(0,122,255,0.25)}
.brand__name{font-weight:600;font-size:var(--fs-sm);letter-spacing:-0.015em}
.brand__sub{font-size:var(--fs-xs);color:var(--muted);margin-top:1px;font-weight:500}
.nav-item{display:flex;align-items:center;gap:var(--sp-3);padding:8px 10px;border-radius:8px;color:var(--text);font-weight:500;font-size:var(--fs-sm);text-align:left;width:100%;transition:background .12s}
.nav-item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;opacity:.75}
.nav-item:hover{background:var(--fill-quaternary)}
.nav-item.is-active{background:var(--primary);color:#fff;font-weight:600}
.nav-item.is-active svg{opacity:1}
.nav-sep{height:1px;background:var(--separator);margin:6px 10px;opacity:.7}
.main{display:flex;flex-direction:column;min-width:0}
.header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:.5px solid var(--separator);padding:12px var(--sp-5);padding-top:calc(12px + var(--safe-top));display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.header__left{display:flex;align-items:center;gap:var(--sp-3);min-width:0;flex:1}
.header__title{font-size:22px;font-weight:700;letter-spacing:-0.022em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header__sub{font-size:var(--fs-xs);color:var(--muted);margin-top:2px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header__actions{display:flex;gap:var(--sp-2);align-items:center;flex:none}
.nav-arrows{display:flex;gap:var(--sp-1);flex:none}
.nav-arrows button{width:32px;height:32px;border-radius:8px;background:var(--fill-tertiary);display:grid;place-items:center;color:var(--text);flex:none;transition:background .12s}
.nav-arrows button:hover:not(:disabled){background:var(--fill-secondary)}
.nav-arrows button:disabled{opacity:.35;cursor:default}
.nav-arrows svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:10px;font-weight:590;font-size:var(--fs-sm);background:var(--fill-tertiary);color:var(--text);white-space:nowrap;min-height:36px;letter-spacing:-0.01em;transition:background .12s,transform .1s,opacity .12s}
.btn:hover{background:var(--fill-secondary)}
.btn:active{transform:scale(.97);opacity:.9}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn--primary{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(0,122,255,0.20)}
.btn--primary:hover{background:color-mix(in srgb,var(--primary) 90%,#000);box-shadow:0 2px 6px rgba(0,122,255,0.28)}
.btn--ghost{background:transparent;color:var(--primary)}
.btn--ghost:hover{background:color-mix(in srgb,var(--primary) 10%,transparent)}
.btn--sm{padding:6px 10px;font-size:var(--fs-xs);border-radius:8px;min-height:30px;gap:4px}
.btn--sm svg{width:13px;height:13px}
.btn--danger{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red-text)}
.btn--danger:hover{background:color-mix(in srgb,var(--red) 20%,transparent)}
.content{padding:var(--sp-4);padding-bottom:calc(var(--sp-6) + var(--nav-h) + var(--sp-5));display:flex;flex-direction:column;gap:var(--sp-3);max-width:1400px;width:100%;min-width:0;margin:0 auto}
.view{display:none;flex-direction:column;gap:var(--sp-3);min-width:0}
.view.is-active{display:flex;animation:fadeUp .3s cubic-bezier(.2,.9,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:var(--sp-3);min-width:0}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:var(--sp-4);border:.5px solid var(--line);overflow:hidden;min-width:0;box-shadow:var(--shadow-sm)}
.panel__head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-3);flex-wrap:wrap;min-width:0}
.panel__title{font-size:var(--fs-sm);font-weight:600;letter-spacing:-0.014em}
.panel__sub{font-size:var(--fs-xs);color:var(--muted);margin-top:2px;font-weight:500}
.kpi{padding:var(--sp-4);border-radius:var(--r-lg);background:var(--surface);border:.5px solid var(--line);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:var(--sp-1);position:relative;overflow:hidden;min-width:0;transition:transform .12s,box-shadow .12s}
.kpi:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.kpi__label{font-size:var(--fs-xs);color:var(--muted);font-weight:500;letter-spacing:0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi__value{font-size:var(--fs-xl);font-weight:600;letter-spacing:-0.028em;line-height:1.15;word-break:break-word;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.kpi__hint{font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi--hero{grid-column:span 2;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border:0;box-shadow:0 4px 20px rgba(0,122,255,0.20)}
.kpi--hero .kpi__label,.kpi--hero .kpi__hint{color:rgba(255,255,255,.82)}
.kpi--hero .kpi__value{font-size:var(--fs-2xl);font-weight:700;letter-spacing:-0.032em}
.kpi__pill{position:absolute;top:var(--sp-3);right:var(--sp-3);font-size:var(--fs-xs);font-weight:600;padding:3px 8px;border-radius:var(--r-full);background:rgba(255,255,255,.22);color:#fff;letter-spacing:0.02em}
.kpi--today{background:linear-gradient(135deg,color-mix(in srgb,var(--amber) 8%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--amber) 26%,var(--line))}
.kpi--today .kpi__value{color:var(--amber-text)}
.kpi--income{background:linear-gradient(135deg,color-mix(in srgb,var(--green) 8%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--green) 26%,var(--line))}
.kpi--income .kpi__value{color:var(--green-text)}
.kpi--card-debt{background:linear-gradient(135deg,color-mix(in srgb,var(--red) 6%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--red) 20%,var(--line))}
.kpi--card-debt .kpi__value{color:var(--red-text)}
.acct{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);background:var(--surface);border-radius:var(--r-md);min-width:0;cursor:pointer;transition:background .12s;border:.5px solid var(--line);touch-action:manipulation}
.acct:hover,.acct:active{background:var(--fill-quaternary)}
.acct.is-disabled{opacity:.5}
.acct.is-disabled .acct__bal{text-decoration:line-through}
.acct__toggle{position:relative;width:36px;height:22px;border-radius:var(--r-full);background:var(--fill-tertiary);flex:none;cursor:pointer;border:0;padding:0;transition:background .25s}
.acct__toggle::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .25s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.acct__toggle.on{background:var(--green)}
.acct__toggle.on::after{transform:translateX(14px)}
.acct__ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none;color:#fff}
.acct__main{flex:1;min-width:0;overflow:hidden}
.acct__name{font-weight:500;font-size:var(--fs-sm);letter-spacing:-0.014em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct__type{font-size:var(--fs-xs);color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct__bal{font-weight:600;font-size:var(--fs-sm);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums;letter-spacing:-0.014em}
.scroll-x{display:flex;gap:var(--sp-3);overflow-x:auto;padding-bottom:var(--sp-2);scrollbar-width:none;margin:0 calc(-1*var(--sp-4));padding-left:var(--sp-4);padding-right:var(--sp-4)}
.scroll-x::-webkit-scrollbar{display:none}
.scroll-x>*{flex:0 0 auto!important;width:var(--cc-w)!important;max-width:var(--cc-w)!important;min-width:var(--cc-w)!important}
.scroll-x--visible{padding-bottom:var(--sp-3)}
.scroll-x--visible::-webkit-scrollbar{display:block;height:5px}
.scroll-x--visible::-webkit-scrollbar-track{background:var(--fill-quaternary);border-radius:3px}
.scroll-x--visible::-webkit-scrollbar-thumb{background:var(--fill-secondary);border-radius:3px}
.cc{position:relative;border-radius:var(--r-lg);padding:var(--sp-4);color:#fff;height:var(--cc-h);display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;cursor:pointer;transition:transform .18s cubic-bezier(.2,.9,.3,1),box-shadow .18s;box-shadow:0 4px 16px rgba(0,0,0,0.12)}
.cc:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,0.16)}
.cc::after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.09);top:-110px;right:-70px;pointer-events:none}
.cc__top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;gap:var(--sp-2)}
.cc__name{font-size:var(--fs-sm);font-weight:600;letter-spacing:-0.014em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc__brand{font-size:var(--fs-xs);opacity:.9;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;margin-top:2px}
.cc__num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:var(--fs-sm);letter-spacing:0.14em;position:relative;z-index:1;opacity:.96;font-variant-numeric:tabular-nums}
.cc__bottom{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1;gap:var(--sp-2)}
.cc__label{font-size:10px;opacity:.85;font-weight:500;text-transform:uppercase;letter-spacing:0.04em}
.cc__val{font-size:var(--fs-sm);font-weight:600;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cc__util{margin-top:var(--sp-2);position:relative;z-index:1}
.cc__bar{height:3px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:var(--sp-1)}
.cc__bar>div{height:100%;background:#fff;border-radius:3px}
.cc__actions{position:absolute;top:var(--sp-3);right:var(--sp-3);display:flex;gap:var(--sp-1);z-index:3}
.cc__actions .icon-btn{width:28px;height:28px;background:rgba(255,255,255,.22);color:#fff}
.cc__actions .icon-btn:hover{background:rgba(255,255,255,.36)}
.list{display:flex;flex-direction:column;gap:var(--sp-2);min-width:0}
.row{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3);background:var(--surface);border-radius:var(--r-md);min-width:0;cursor:pointer;transition:background .12s;border:.5px solid var(--line);touch-action:manipulation}
.row:hover,.row:active{background:var(--fill-quaternary)}
.row--alert{background:color-mix(in srgb,var(--red) 4%,var(--surface));border-color:color-mix(in srgb,var(--red) 22%,var(--line))}
.row__ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none}
.row__ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row__main{flex:1;min-width:0;overflow:hidden}
.row__title{font-size:var(--fs-sm);font-weight:500;letter-spacing:-0.014em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row__sub{font-size:var(--fs-xs);color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row__amt{font-size:var(--fs-sm);font-weight:600;white-space:nowrap;flex:none;font-variant-numeric:tabular-nums;letter-spacing:-0.014em}
.pos{color:var(--green-text)}
.neg{color:var(--red-text)}
.row__actions{display:flex;gap:var(--sp-1);flex:none}
.icon-btn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .12s,color .12s}
.icon-btn:hover{background:var(--fill-quaternary);color:var(--text)}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mv-check{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--separator);background:transparent;display:grid;place-items:center;cursor:pointer;flex:none;transition:all .18s cubic-bezier(.2,.9,.3,1);padding:0;touch-action:manipulation;margin-right:var(--sp-1)}
.mv-check svg{width:13px;height:13px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .15s;display:block;background:transparent}
.mv-check:hover{border-color:var(--green)}
.mv-check.is-checked{background:var(--green);border-color:var(--green)}
.mv-check.is-checked svg{opacity:1}
.mv-check:active{transform:scale(.88)}
.mv-check--locked{cursor:default;opacity:.5}
.mv-check--locked:active{transform:none}
.mv-check--planned{border-color:var(--muted);background:transparent}
.mv-check--planned:hover{background:color-mix(in srgb,var(--muted) 12%,transparent)}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:var(--r-full);font-size:11px;font-weight:600;letter-spacing:0.02em;white-space:nowrap}
.badge--g{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green-text)}
.badge--r{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red-text)}
.badge--a{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber-text)}
.badge--b{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--primary)}
.badge--p{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.chip{padding:7px 14px;border-radius:var(--r-full);border:.5px solid var(--line);background:var(--surface);font-size:var(--fs-xs);font-weight:500;color:var(--text);transition:all .15s;display:inline-flex;align-items:center;gap:var(--sp-1);touch-action:manipulation;min-height:32px;cursor:pointer;user-select:none;letter-spacing:-0.005em}
.chip:hover:not(.is-active){background:var(--fill-quaternary)}
.chip.is-active{background:var(--primary);color:#fff;border-color:transparent;font-weight:600}
.chip:active{transform:scale(.96)}
.seg{display:inline-flex;background:var(--fill-tertiary);border-radius:9px;padding:2px;flex-wrap:nowrap;overflow:hidden;max-width:100%}
.seg button{padding:6px 12px;border-radius:7px;font-size:var(--fs-xs);font-weight:500;color:var(--text);transition:all .18s cubic-bezier(.2,.9,.3,1);flex:1;min-width:0;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-1);letter-spacing:-0.005em}
.seg button.is-active{background:var(--surface);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06),0 0 0 0.5px rgba(0,0,0,.02)}
body.dark .seg button.is-active{background:var(--surface-3);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.radio-group{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.radio-group label{display:inline-flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3);border-radius:var(--r-md);background:var(--fill-quaternary);font-size:var(--fs-sm);cursor:pointer;user-select:none;border:.5px solid transparent;transition:all .12s;font-weight:500}
.radio-group label:hover{background:var(--fill-tertiary)}

.saved-chart__main{flex:1;min-width:0;overflow:hidden}
.saved-chart__name{font-weight:500;font-size:var(--fs-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.014em}
.saved-chart__meta{font-size:var(--fs-xs);color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-chart__actions{display:flex;gap:2px;flex:none}
.ios-switch{position:relative;width:50px;height:30px;border-radius:var(--r-full);background:var(--fill-tertiary);transition:background .25s;flex:none;cursor:pointer;border:0;touch-action:manipulation}
.ios-switch::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:#fff;top:2px;left:2px;transition:transform .25s cubic-bezier(.2,.9,.3,1);box-shadow:0 2px 6px rgba(0,0,0,.15),0 0 0 0.5px rgba(0,0,0,.04)}
.ios-switch.on{background:var(--green)}
.ios-switch.on::after{transform:translateX(20px)}
.setting{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-1);font-size:var(--fs-sm);min-height:52px}
.setting+.setting{border-top:.5px solid var(--separator)}
.setting__ico{width:30px;height:30px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
.setting__ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sim-compare{display:grid;grid-template-columns:1fr;gap:var(--sp-3);margin-top:var(--sp-3)}
.sim-box{padding:var(--sp-3);border-radius:var(--r-md);background:var(--surface-2);border:.5px solid var(--line)}
.sim-box__title{font-size:var(--fs-xs);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:var(--sp-2)}
.sim-box__row{display:flex;justify-content:space-between;font-size:var(--fs-sm);padding:var(--sp-1) 0;gap:var(--sp-2);flex-wrap:wrap}
.sim-box__row b{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-0.014em}
.sim-box--good{background:color-mix(in srgb,var(--green) 8%,var(--surface));border-color:color-mix(in srgb,var(--green) 24%,var(--line))}
.sim-box--good .sim-box__title{color:var(--green-text)}
.detail-kpi{padding:var(--sp-3);background:var(--surface);border:.5px solid var(--line);border-radius:var(--r-md);display:flex;flex-direction:column;gap:2px;min-width:0}
.detail-kpi__label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-kpi__value{font-size:var(--fs-base);font-weight:600;letter-spacing:-0.022em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.acc-bal{font-size:var(--fs-xs);color:var(--muted);font-weight:500;margin-top:2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.acc-bal b{color:var(--text);font-weight:600}
.sec-badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;padding:2px 8px;border-radius:var(--r-full);margin-right:var(--sp-2);vertical-align:middle}
.sec-badge--real{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green-text)}
.sec-badge--plan{background:color-mix(in srgb,var(--muted) 18%,transparent);color:var(--muted)}
.builder-inline{background:var(--surface-2);border-radius:var(--r-lg);padding:var(--sp-4);margin-top:var(--sp-3);border:.5px solid var(--line)}
.month-group{margin-bottom:var(--sp-2);border-radius:var(--r-md);background:var(--surface-2);border:.5px solid var(--line);overflow:hidden}
.month-group__head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-3);cursor:pointer;user-select:none;transition:background .12s}
.month-group__head:hover{background:var(--fill-quaternary)}
.month-group__label{font-size:var(--fs-xs);font-weight:600;text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;letter-spacing:-0.01em}
.month-group__meta{font-size:var(--fs-xs);color:var(--muted);font-weight:500;flex:none;display:flex;align-items:center;gap:var(--sp-2);white-space:nowrap}
.month-group__meta svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.month-group.is-collapsed .month-group__meta svg{transform:rotate(-90deg)}
.month-group__body{padding:0 var(--sp-3) var(--sp-3);display:flex;flex-direction:column;gap:var(--sp-2)}
.month-group.is-collapsed .month-group__body{display:none}
.cat-drag-list{display:flex;flex-direction:column;gap:var(--sp-2)}
.cat-drag-item{position:relative}
.cat-drag-item.dragging{opacity:.35}
.cat-drag-item.drag-over>.cat-inner{outline:2px dashed var(--primary);outline-offset:2px;background:color-mix(in srgb,var(--primary) 8%,var(--surface-2))!important}
.cat-dropzone{height:12px;border-radius:var(--r-sm);margin:2px 0;transition:all .15s}
.cat-dropzone.is-dragover{height:44px;background:color-mix(in srgb,var(--primary) 12%,transparent);border:2px dashed var(--primary);display:grid;place-items:center;color:var(--primary);font-size:var(--fs-xs);font-weight:600;border-radius:var(--r-sm)}
.cat-dropzone.is-dragover::after{content:"Soltar aquí como categoría principal"}
.cat-drag-handle{color:var(--muted);flex:none;padding:var(--sp-2);display:inline-grid;place-items:center;touch-action:none;cursor:grab;user-select:none;border-radius:var(--r-sm);transition:background .12s}
.cat-drag-handle:hover{background:var(--fill-quaternary);color:var(--text)}
.cat-drag-handle:active{cursor:grabbing}
.cat-drag-handle svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.sub-drag-item{cursor:grab;user-select:none}
.sub-drag-item.dragging{opacity:.35}
.cat-inner{transition:outline .12s,background .12s}
.cat-drag-ghost{position:fixed;pointer-events:none;opacity:.85;z-index:9999;transform:rotate(2deg);box-shadow:var(--shadow-lg);border-radius:var(--r-md);background:var(--surface);padding:var(--sp-3);border:1.5px solid var(--primary)}
.skeleton{background:linear-gradient(90deg,var(--fill-tertiary) 0%,var(--fill-quaternary) 50%,var(--fill-tertiary) 100%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--r-sm)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.skeleton{animation:none;background:var(--fill-tertiary)}}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .bottom-nav{display:flex}
  .header{padding-left:var(--sp-4);padding-right:var(--sp-4)}
  .header__title{font-size:var(--fs-xl)}
  .content{padding-left:var(--sp-4);padding-right:var(--sp-4)}
  .grid-3,.grid-4{grid-template-columns:repeat(2,1fr)}
  .kpi__value{font-size:var(--fs-lg)}
  .kpi--hero .kpi__value{font-size:var(--fs-xl)}
  .panel{padding:var(--sp-3)}
  .scroll-x>*{width:min(240px,74vw)!important;max-width:min(240px,74vw)!important;min-width:min(240px,74vw)!important}
  .cc{height:154px}
}
@media(max-width:400px){
  .header__title{font-size:var(--fs-lg)}
  .kpi{padding:var(--sp-3)}
  .kpi__value{font-size:var(--fs-base)}
  .kpi--hero .kpi__value{font-size:var(--fs-lg)}
  .panel{padding:var(--sp-3)}
  .row{padding:var(--sp-2) var(--sp-3);gap:var(--sp-2)}
  .row__ico{width:34px;height:34px;font-size:var(--fs-base)}
  .btn{padding:var(--sp-2);font-size:var(--fs-xs)}
  .grid-3,.grid-4{grid-template-columns:repeat(2,1fr);gap:var(--sp-2)}
  .cal-day{min-height:58px}
}
@media(max-width:900px) and (orientation:landscape){
  .header{padding-top:var(--sp-2)}
  .header__sub{display:none}
  .content{padding-bottom:calc(var(--sp-4) + var(--nav-h))}
}

/* ============ v30 · iOS NATIVE POLISH (rejilla 8pt · radios 12/16 · jerarquía SF) ============ */
:root{--r-md:12px;--r-lg:16px;--hit:44px;--gap:16px;--ease:cubic-bezier(.32,.72,0,1)}
body{font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent;text-rendering:optimizeLegibility}
body.dark{--line:rgba(255,255,255,.08)}
.kpi__value,.row__amt,.panel__sub,td,.axis{font-variant-numeric:tabular-nums}
/* Tarjetas: sin bordes duros, elevación sutil */
.panel,.kpi{border:0;border-radius:var(--r-lg);box-shadow:0 0 0 .5px var(--line),0 1px 3px rgba(0,0,0,.04)}
body.dark .panel,body.dark .kpi{box-shadow:0 0 0 .5px var(--line)}
.panel{padding:var(--sp-4)}
.panel__head{margin-bottom:var(--sp-4)}
.panel__title{font-size:17px;font-weight:600;letter-spacing:-.022em}
.panel__sub{font-size:13px;color:var(--text-3);font-weight:400;margin-top:2px}
.kpi:hover{transform:none;box-shadow:0 0 0 .5px var(--line),0 1px 3px rgba(0,0,0,.04)}
.kpi:active,.row:active,.panel[data-goto]:active{transform:scale(.985);transition:transform .15s var(--ease)}
.kpi{padding:var(--sp-4);gap:var(--sp-1)}
.kpi__label{font-size:13px;font-weight:500;letter-spacing:0;color:var(--text-2)}
.kpi__value{font-size:22px;font-weight:700;letter-spacing:-.03em}
.kpi__hint{font-size:12px;color:var(--text-3)}
.kpi--hero{border-radius:20px;padding:var(--sp-5)}
.kpi--hero .kpi__value{font-size:34px;font-weight:700}
.kpi--today,.kpi--income,.kpi--card-debt{background:var(--surface)}
.grid-3,.grid-4,.dash-pair,.analytics-pair{gap:var(--gap)}
.section-title{font-size:13px;letter-spacing:.02em;color:var(--text-3);padding:0 var(--sp-4);margin-bottom:var(--sp-2)}
/* Listas agrupadas estilo Ajustes de iOS */
.list{gap:0;background:var(--surface);border-radius:var(--r-lg);overflow:hidden;box-shadow:0 0 0 .5px var(--line)}
.row{border:0;border-radius:0;border-bottom:.5px solid var(--line);padding:var(--sp-3) var(--sp-4);min-height:56px;background:transparent}
.list>.row:last-child{border-bottom:0}
.row:hover{background:var(--fill-quaternary)}
.row:active{background:var(--fill-tertiary);transform:none}
.row__ico{width:36px;height:36px;border-radius:9px;font-size:17px}
.panel .list{background:transparent;box-shadow:none;border-radius:0;margin:0 calc(var(--sp-4)*-1)}
/* Controles */
.seg{border-radius:10px;padding:2px;background:var(--fill-tertiary)}
.seg button{border-radius:8px;padding:6px 14px;min-height:28px;font-size:13px;font-weight:500}
.seg button.is-active{font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.chip{border-radius:var(--r-full);min-height:32px}
.field input:not([type=checkbox]):not([type=radio]),.field select,.field textarea{border:0;background:var(--fill-tertiary);border-radius:var(--r-md);min-height:var(--hit)}
.field>span{font-size:12px;letter-spacing:.02em;text-transform:uppercase;color:var(--text-3);padding-left:var(--sp-1)}
/* Cabecera y barra inferior */
.header{background:color-mix(in srgb,var(--bg) 72%,transparent);border-bottom:.5px solid var(--line)}
.header__title{font-size:28px;font-weight:700;letter-spacing:-.034em}
.header__sub{font-size:13px;color:var(--text-3);font-weight:400}
.nav-item{border-radius:10px;padding:9px 12px;font-weight:500}
.nav-item.is-active{background:color-mix(in srgb,var(--primary) 14%,transparent);color:var(--primary)}
.nav-item.is-active svg{opacity:1}
.bn-item{min-width:68px;padding:6px 4px 4px;font-size:10px;font-weight:500;color:var(--text-3)}
.bn-item svg{width:24px;height:24px;stroke-width:1.7;margin-bottom:1px}
.bn-item.is-active{color:var(--primary)}
.bn-item.is-active svg{stroke-width:2.1}
.bottom-nav{border-top:.5px solid var(--separator);background:color-mix(in srgb,var(--surface) 72%,transparent)}
/* Hojas modales con asa */
.modal{border-radius:20px 20px 0 0;position:relative;padding-top:var(--sp-5)}
.modal::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--fill-secondary)}
.overlay--full .modal::before{display:none}
.toast{border-radius:14px}
@media(max-width:900px){
  :root{--gap:12px}
  .content{padding-top:var(--sp-3)}
  .panel{padding:var(--sp-4)}
  .kpi__value{font-size:20px}
  .kpi--hero .kpi__value{font-size:30px}
  .header__title{font-size:26px}
  .seg button,.chip{min-height:var(--hit)}
  .seg button{min-height:32px}
}
@media(max-width:400px){
  .kpi__value{font-size:18px}.kpi--hero .kpi__value{font-size:26px}.header__title{font-size:22px}
  .panel{padding:var(--sp-3) var(--sp-4)}.row{padding:var(--sp-3)}
}
@media(min-width:901px){.content{padding:var(--sp-6) var(--sp-8)}.header{padding-left:var(--sp-8);padding-right:var(--sp-8)}}
/* v31 · Ritmo vertical único: 1 sola separación (--gap) entre tarjetas */
.content,.view{gap:var(--gap)}
.view>*,.dash-pair>*,.analytics-pair>*,.laptop-pair>*,.accounts-pair>*,.triple-pair>*{margin-top:0!important;margin-bottom:0!important}
.grid{gap:var(--gap)}
.dash-pair,.analytics-pair,.laptop-pair,.accounts-pair,.triple-pair{display:grid;gap:var(--gap);align-items:start}
@media(max-width:1099px){.dash-pair,.analytics-pair,.laptop-pair,.accounts-pair{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.triple-pair{grid-template-columns:minmax(0,1fr)}}
/* v31 · Gráficos para iPhone 13 (390px): más anchos, más altos, texto legible */
@media(max-width:480px){
  :root{--chart-h-sm:260px;--chart-h-md:340px;--chart-h-lg:420px}
  .chart-frame{margin:0 calc(var(--sp-2)*-1);width:calc(100% + var(--sp-4));min-height:0}
  .chart-frame--lg{min-height:0}
  .chart .axis{font-size:14px!important}
  .chart-legend>*,.legend-item{font-size:13px}
}

/* ============ v32 · ICONOS MINIMALISTAS ESTILO NOTION ============ */
.ni{display:inline-flex;align-items:center;justify-content:center;width:1.2em;height:1.2em;vertical-align:-.22em;flex:none;color:inherit;line-height:1}
.ni svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.row__ico:has(.ni){background:var(--fill-tertiary)!important;color:var(--text-2)!important}
.row__ico .ni{width:20px;height:20px;vertical-align:baseline}
.emoji-grid button{color:var(--text-2);display:grid;place-items:center}
.emoji-grid button .ni{width:22px;height:22px}
.emoji-grid button.is-active{color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent)}
.chip .ni,.legend-item .ni,.chart-legend .ni{width:1.1em;height:1.1em;color:var(--text-2)}

/* ============ v34 · Filas de movimientos más limpias + color por tipo ============ */
.row:has(.row__amt){gap:var(--sp-2)}
.row:has(.mv-check){padding-left:var(--sp-2)}
.row .mv-check{width:20px;height:20px;border-width:1.6px}
.row .mv-check svg{width:12px;height:12px}
.row:has(.row__amt) .row__ico{width:30px;height:30px;border-radius:8px}
.row:has(.row__amt) .row__ico .ni{width:16px;height:16px}
.row:has(.row__amt) .row__ico svg{width:15px;height:15px}
.row:has(.row__actions){padding-right:var(--sp-1)}
.row__actions .icon-btn{width:30px;height:30px;margin-right:-2px}
.row__actions .icon-btn svg{width:16px;height:16px}
/* Iconos: gasto = rojo · ingreso = verde */
.row:has(.row__amt.neg) .row__ico:has(.ni){background:color-mix(in srgb,var(--red) 13%,transparent)!important;color:var(--red)!important}
.row:has(.row__amt.pos) .row__ico:has(.ni){background:color-mix(in srgb,var(--green) 15%,transparent)!important;color:var(--green)!important}
.panel:has([data-ui-collapse="catExpense"]) .row__ico:has(.ni){background:color-mix(in srgb,var(--red) 13%,transparent)!important;color:var(--red)!important}
.panel:has([data-ui-collapse="catIncome"]) .row__ico:has(.ni){background:color-mix(in srgb,var(--green) 15%,transparent)!important;color:var(--green)!important}
.group-toggle:not(.is-active){opacity:.55}
/* ============ FIN v30-v34 ============ */

/* ============ v35 · MINIMALISTA + RESPONSIVE ============ */
:root{--bg:#F7F7F8;--line:rgba(60,60,67,.10);--plomo:#9A9AA0}
body.dark{--plomo:#6F6F76}
.content{max-width:1180px}
/* Sin parejas de paneles: cada gráfico ocupa el ancho completo y puede dibujarse 1:1 */
.dash-pair,.analytics-pair,.laptop-pair,.accounts-pair{grid-template-columns:minmax(0,1fr)!important}
/* Superficies planas: borde fino, sin sombras ni degradados */
.panel,.kpi{border:.5px solid var(--line);box-shadow:none;border-radius:14px}
.kpi:hover{box-shadow:none}
.list{box-shadow:none;border:.5px solid var(--line)}
.panel .list{border:0}
.kpi--hero{background:var(--surface);color:var(--text);border:.5px solid var(--line);box-shadow:none;border-radius:14px;padding:var(--sp-4)}
.kpi--hero .kpi__label,.kpi--hero .kpi__hint{color:var(--text-3)}
.kpi--hero .kpi__pill{background:var(--fill-tertiary);color:var(--text-2)}
.kpi--hero .kpi__value{font-size:32px;font-weight:700}
.btn--primary,.btn--primary:hover{box-shadow:none}
.header__title{font-size:24px;letter-spacing:-.03em}
.panel__title{font-size:16px}
.section-title{padding:0}
.chip.is-active,.nav-item.is-active{box-shadow:none}
.row--alert{background:transparent;border-color:var(--line)}
.row--alert .row__sub{color:var(--red-text)}
.row[style*="dashed"]{border-style:solid!important}
/* Check de estado: cuadrado pequeño a la izquierda · verde = real · plomo = planificado · rojo = atrasado */
.mv-check,.row .mv-check{width:16px;height:16px;min-width:16px;border:0;border-radius:4px;background:var(--green);display:grid;place-items:center;padding:0;margin:0 2px 0 0;position:relative;flex:none;opacity:1}
.mv-check::after{content:"";position:absolute;inset:-10px}
.mv-check svg,.row .mv-check svg{width:11px;height:11px;stroke:#fff;stroke-width:3.6;opacity:1}
.mv-check.is-checked{background:var(--green)}
.mv-check.mv-check--planned,.mv-check.mv-check--planned:hover{background:var(--plomo)}
.row--alert .mv-check--planned,.row--alert .mv-check--planned:hover{background:var(--red)}
.mv-check:hover{filter:brightness(1.08);border:0}
.mv-check--locked{opacity:.45}
.row:has(.mv-check){padding-left:var(--sp-3)}
/* Navegación inferior: 5 accesos + Más */
.bottom-nav{justify-content:space-around;overflow:visible;padding-left:4px;padding-right:4px}
.bn-item{flex:1 1 0;min-width:0;padding:6px 2px 4px}
.bn-item span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bnMore svg circle{fill:currentColor}
.more-list{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;overflow:hidden;border:.5px solid var(--line);margin-top:var(--sp-3)}
.more-item{display:flex;align-items:center;gap:12px;padding:14px;text-align:left;border-bottom:.5px solid var(--line);width:100%;min-height:60px}
.more-item:last-child{border-bottom:0}
.more-item:active{background:var(--fill-tertiary)}
.more-item__ico{width:34px;height:34px;border-radius:9px;background:var(--fill-tertiary);display:grid;place-items:center;color:var(--text-2);flex:none}
.more-item__ico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.more-item__txt{flex:1;display:flex;flex-direction:column;min-width:0}
.more-item__txt b{font-weight:600;font-size:15px}
.more-item__txt small{color:var(--text-3);font-size:12px}
.more-item__arrow{width:16px;height:16px;stroke:var(--text-3);fill:none;stroke-width:2;flex:none}
/* Sección Movimientos */
.mv-bar{display:flex;flex-direction:column;gap:12px}
.mv-search-wrap{position:relative}
.mv-search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--text-3);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.mv-search{width:100%;min-height:42px;padding:10px 12px 10px 36px;border:.5px solid var(--line);border-radius:12px;background:var(--surface);outline:none}
.mv-search:focus{border-color:var(--primary)}
.mv-status{display:flex;width:100%}
.mv-status button{gap:6px}

.acct{gap:var(--sp-2);position:relative;z-index:1;transition:transform .25s var(--ease,ease)}
.acct.is-disabled{opacity:1}

.acct__toggle{width:20px;height:20px;border-radius:6px;background:transparent;border:1.5px solid var(--text-3);display:grid;place-items:center;flex:none;padding:0;transition:background .15s,border-color .15s}
.acct__toggle::after{display:none}
.acct__toggle svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.acct__toggle.on{background:var(--green);border-color:var(--green)}
.acct__toggle.on svg{opacity:1}
.acct__toggle:not(.on){background:var(--fill-tertiary);border-color:var(--fill-secondary)}

.acct-actions{position:absolute;right:0;top:0;bottom:0;width:132px;display:flex}

.acct-actions .icon-btn svg{width:18px;height:18px;stroke:#fff}
.acct-actions .icon-btn:nth-child(1){background:var(--primary)}
.acct-actions .icon-btn:nth-child(2){background:#8E8E93}
.acct-actions .icon-btn:nth-child(3){background:var(--red)}
.acct-wrap.is-open .acct{transform:translateX(-132px)}
.acct-wrap:not(.is-open):not(.is-drag) .acct-actions{visibility:hidden}
@media(hover:hover) and (pointer:fine){

  .acct-wrap>.acct{flex:1;min-width:0}

  .acct-actions .icon-btn{flex:none;width:30px;height:30px;border-radius:8px;background:transparent!important;color:var(--text-3)}
  .acct-actions .icon-btn svg{stroke:currentColor}
  .acct-actions .icon-btn:hover{background:var(--fill-tertiary)!important}
  .acct-wrap.is-open .acct{transform:none}

}

function chartRealVsPlanned({height=320}={}){
  const now=new Date();
  const keyOf=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  const prev=new Date(now.getFullYear(),now.getMonth()-1,1);
  const next=new Date(now.getFullYear(),now.getMonth()+1,1);
  const tk=keyOf(now),pk=keyOf(prev),nk=keyOf(next);
  const rI=k=>state.transactions.filter(t=>t.type==='income'&&monthKey(t.date)===k).reduce((s,t)=>s+t.amount,0);
  const rE=k=>state.transactions.filter(t=>t.type==='expense'&&monthKey(t.date)===k).reduce((s,t)=>s+t.amount+(t.fee||0),0);
  const pI=k=>state.planned.filter(p=>!p.done&&p.type==='income'&&monthKey(p.date)===k).reduce((s,p)=>s+p.amount,0);
  const pE=k=>state.planned.filter(p=>!p.done&&p.type==='expense'&&monthKey(p.date)===k).reduce((s,p)=>s+p.amount,0);
  const months=[
    {label:prev.toLocaleDateString('es-EC',{month:'short'}).replace('.',''),rI:rI(pk),rE:rE(pk),pI:0,pE:0},
    {label:now.toLocaleDateString('es-EC',{month:'short'}).replace('.',''),rI:rI(tk),rE:rE(tk),pI:pI(tk),pE:pE(tk)},
    {label:next.toLocaleDateString('es-EC',{month:'short'}).replace('.',''),rI:0,rE:0,pI:pI(nk),pE:pE(nk)}
  ];
  const max=Math.max(...months.flatMap(m=>[m.rI+m.pI,m.rE+m.pE]),1);
  const fs=11,W=CW,H=height;
  const pad={t:28,r:20,b:44,l:62};
  const iW=W-pad.l-pad.r,iH=H-pad.t-pad.b;
  const step=iW/months.length,bw=Math.min(step*0.28,40),gap=6;
  const uid='vcrp'+Math.random().toString(36).slice(2,8);
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Real vs Planificado">`;

      <rect width="8" height="8" fill="#34C759" fill-opacity="0.12"/>

    </pattern>
    <pattern id="${uid}r" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(-45)">
      <rect width="8" height="8" fill="#FF3B30" fill-opacity="0.12"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#FF3B30" stroke-width="2.5" stroke-opacity="0.85"/>

  for(let i=0;i<=4;i++){
    const y=pad.t+iH*i/4;
    s+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y}" y2="${y}" class="grid-line"/>`;
    s+=`<text x="${pad.l-6}" y="${y+4}" text-anchor="end" class="axis" style="font-size:${fs}px">${fmtShort(max*(1-i/4))}</text>`;
  }
  const baseY=pad.t+iH;
  months.forEach((m,mi)=>{
    const cx=pad.l+step*mi+step/2;

    const expX=cx+gap/2;

    if(m.rE>0)s+=`<rect x="${expX}" y="${baseY-expRH}" width="${bw}" height="${expRH}" rx="4" fill="#FF3B30"/>`;
    if(m.pE>0)s+=`<rect x="${expX}" y="${baseY-expRH-expPH}" width="${bw}" height="${expPH}" rx="4" fill="url(#${uid}r)"/>`;

  </div>`;
  return fr(s)+lgd;
}
function getTopCategoriesMonth(mk,limit){

function buildFlowSeries(months){months=months||tfMonths(DASHTF.tf);
  const ob=enabledAccounts().reduce((s,a)=>s+a.balance,0);
  const realBal=upTo=>{let s=ob;state.transactions.forEach(t=>{if(!activeTx(t)||monthKey(t.date)>upTo)return;if(t.type==='income')s+=t.amount;else if(t.type==='expense')s-=t.amount+(t.fee||0);else if(t.type==='transfer')s-=(t.fee||0);});return s;};
  const planNet=upTo=>{let s=0;state.planned.forEach(p=>{if(p.done||monthKey(p.date)>upTo)return;if(p.type==='income')s+=p.amount;if(p.type==='expense')s-=p.amount;});return s;};
  const fr2=months.map(m=>realBal(m.key));const fp=months.map((m,i)=>fr2[i]+planNet(m.key));
  const ri=[],re=[],pi=[],pe=[];
  months.forEach(m=>{let a=0,b=0,c=0,d=0;state.transactions.forEach(t=>{if(monthKey(t.date)!==m.key||!activeTx(t))return;if(t.type==='income')a+=t.amount;if(t.type==='expense')b+=t.amount+(t.fee||0);if(t.type==='transfer')b+=(t.fee||0);});state.planned.forEach(p=>{if(monthKey(p.date)!==m.key||p.done)return;if(p.type==='income')c+=p.amount;if(p.type==='expense')d+=p.amount;});ri.push(a);re.push(b);pi.push(c);pe.push(d);});
  const labels=months.map((m,i)=>({x:i,label:m.label}));
  return {labels,monthly:{labels:months.map(m=>m.label),ri,re,pi,pe},series:[{key:'flowReal',name:'Flujo real',color:'#007AFF',points:fr2.map((v,i)=>({x:i,y:v})),xLabels:labels},{key:'flowPlan',name:'Flujo planif.',color:'#5AC8FA',points:fp.map((v,i)=>({x:i,y:v})),xLabels:labels}]};}

function txRowHTML(t,actions=true,context,persp){let icon,iconBg,title,subText,amt,amtClass;
  if(t.type==='transfer'&&t.toCardId){const card=getCard(t.toCardId);if(context==='cards'){icon=ICONS.check;iconBg='color-mix(in srgb,var(--green) 18%,transparent)';title=t.note||`Pago recibido`;subText=`Pago tarjeta · ${shortDate(t.date)}`;amt='+'+fmt(t.amount);amtClass='pos';}else{icon=ICONS.card;iconBg='color-mix(in srgb,var(--primary) 14%,transparent)';title=t.note||`Pago ${card?.name||'tarjeta'}`;subText=`Pago tarjeta · ${card?.name||''} · ${shortDate(t.date)}`;amt='−'+fmt(t.amount+(t.fee||0));amtClass='neg';}}
  else if(t.type==='transfer'){const fromN=getAccount(t.accountId)?.name||'?',toN=getAccount(t.toAccountId)?.name||'?';
    if(persp&&persp===t.toAccountId){icon=ICONS.arrowIn;iconBg='color-mix(in srgb,var(--green) 14%,transparent)';title=t.note||'Transferencia recibida';subText=`Desde ${fromN} · ${shortDate(t.date)}`;amt='+'+fmt(t.amount);amtClass='pos';}
    else if(persp&&persp===t.accountId){icon=ICONS.arrowOut;iconBg='color-mix(in srgb,var(--red) 14%,transparent)';title=t.note||'Transferencia enviada';subText=`Hacia ${toN} · ${shortDate(t.date)}`;amt='−'+fmt(t.amount);amtClass='neg';}
    else{icon=ICONS.transfer;iconBg='color-mix(in srgb,var(--primary) 14%,transparent)';title=t.note||'Transferencia';subText=`${fromN} → ${toN} · ${shortDate(t.date)}`;amt=fmt(t.amount+(t.fee||0));amtClass='';}}
  else{const cat=getCat(t.type,t.categoryId);const subCat=getSub(t.type,t.categoryId,t.subId);icon=cat.icon;iconBg=cat.color+'22';title=t.note||cat.name;const extra=t.cardId?(getCard(t.cardId)?.name||''):(getAccount(t.accountId)?.name||'');subText=`${cat.name}${subCat?' › '+subCat.name:''} · ${extra} · ${shortDate(t.date)}${t.installments>1?' · '+t.installments+'c':''}${t.fee?' · '+fmt(t.fee):''}`;const sign=t.type==='income'?'+':'−';const total=t.type==='expense'?t.amount+(t.fee||0):t.amount;amt=sign+fmt(total);amtClass=t.type==='income'?'pos':'neg';}

function plannedTransferRowHTML(p,persp){let icon,iconBg,title,subText,amt,amtClass;
  if(persp&&p.toCardId&&persp===p.toCardId){icon=ICONS.check;iconBg='color-mix(in srgb,var(--green) 18%,transparent)';title=p.note||'Pago programado';subText=`Pago tarjeta · ${dayLabel(p.date)}`;amt='+'+fmt(p.amount);amtClass='pos';}

function plannedRowHTML(p,persp){if(p.type==='transfer')return plannedTransferRowHTML(p,persp);const cat=getCat(p.type,p.categoryId);const sign=p.type==='income'?'+':'−';const acc=p.accountId?getAccount(p.accountId):null;const card=p.cardId?getCard(p.cardId):null;const over=isOverdue(p);const d=over?daysOverdue(p):0;const isFromLoan=!!p.loanId;const subCat=p.subId?getSub(p.type,p.categoryId,p.subId):null;const canToggle=!p.fromDeferred;const checkSVG=`<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>`;const checkAttr=isFromLoan?`data-check-loan-plan="${p.id}"`:`data-check-plan="${p.id}"`;const checkHTML=canToggle?`<button class="mv-check mv-check--planned" ${checkAttr} aria-label="Marcar como realizado">${checkSVG}</button>`:`<button class="mv-check mv-check--planned mv-check--locked" disabled aria-label="Auto">${checkSVG}</button>`;

let cardsChartFilter=[],cardsChartMonths=6,cardsChartSelectedMonths=[],cardsChartSelectedYears=[];
function buildCardsChartMonths(){const now=new Date();const cy=now.getFullYear();const cm=now.getMonth()+1;if(cardsChartSelectedYears.length||cardsChartSelectedMonths.length){const years=cardsChartSelectedYears.length?[...cardsChartSelectedYears].sort():[String(cy)];const months=cardsChartSelectedMonths.length?[...cardsChartSelectedMonths].sort():['01','02','03','04','05','06','07','08','09','10','11','12'];const out=[];years.forEach(y=>{const yN=parseInt(y);months.forEach(m=>{const mN=parseInt(m);if(yN>cy||(yN===cy&&mN>cm))return;const key=`${y}-${m}`;const d=new Date(yN,mN-1,1);out.push({key,label:d.toLocaleDateString('es-EC',{month:'short'}).replace('.','')+" '"+y.slice(2)});});});out.sort((a,b)=>a.key.localeCompare(b.key));return out;}const out=[];for(let i=cardsChartMonths-1;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);out.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,label:d.toLocaleDateString('es-EC',{month:'short'}).replace('.','')});}return out;}
function buildCardsChartData(months){
  const data=months.map(m=>({label:m.label,key:m.key,values:{consumos:{},pagos:{},diferidos:{}}}));
  const monthIdx={};
  months.forEach((m,i)=>{monthIdx[m.key]=i;});
  state.transactions.forEach(t=>{
    const idx=monthIdx[monthKey(t.date)];
    if(idx===undefined)return;
    if(t.type==='expense'&&t.cardId){
      if(t.installments>1){
        data[idx].values.diferidos[t.cardId]=(data[idx].values.diferidos[t.cardId]||0)+t.amount;
      } else {
        data[idx].values.consumos[t.cardId]=(data[idx].values.consumos[t.cardId]||0)+t.amount;
      }
    }
    if(t.type==='transfer'&&t.toCardId){
      data[idx].values.pagos[t.toCardId]=(data[idx].values.pagos[t.toCardId]||0)+t.amount;
    }
  });
  state.planned.forEach(p=>{
    if(p.done||p.type!=='expense'||!p.cardId||!p.fromDeferred)return;
    const idx=monthIdx[monthKey(p.date)];
    if(idx===undefined)return;
    data[idx].values.diferidos[p.cardId]=(data[idx].values.diferidos[p.cardId]||0)+p.amount;
  });

function openSimulateLoan(id){const l=state.loans.find(x=>x.id===id);if(!l)return;const base=amortize(l.principal,l.rate,l.termMonths);

function convertToSub(type,catId,targetCatId){if(catId===targetCatId)return;const cats=state.categories[type];const src=cats.find(c=>c.id===catId);const tgt=cats.find(c=>c.id===targetCatId);if(!src||!tgt)return;if(!confirm(`¿Convertir "${src.name}" en subcategoría de "${tgt.name}"?`))return;state.categories[type]=cats.filter(c=>c.id!==catId);const nt=state.categories[type].find(c=>c.id===targetCatId);if(!nt.subs)nt.subs=[];nt.subs.push({id:src.id,name:src.name,icon:src.icon,budget:Number(src.budget)||0,parentId:targetCatId});state.transactions.forEach(t=>{if(t.categoryId===catId){t.subId=t.subId||catId;t.categoryId=targetCatId;}});state.planned.forEach(p=>{if(p.categoryId===catId){p.subId=p.subId||catId;p.categoryId=targetCatId;}});save();render();toast('Convertida en subcategoría');}

function convertSubToMain(type,catId,subId,index){const cats=state.categories[type];const cat=cats.find(c=>c.id===catId);if(!cat)return;const sub=(cat.subs||[]).find(s=>s.id===subId);if(!sub)return;if(!confirm(`¿Convertir "${sub.name}" en categoría principal?`))return;cat.subs=cat.subs.filter(s=>s.id!==subId);const nc={id:sub.id,name:sub.name,icon:sub.icon||'🏷️',color:cat.color,budget:Number(sub.budget)||0,subs:[]};let ins=clamp(index,0,cats.length);cats.splice(ins,0,nc);state.transactions.forEach(t=>{if(t.categoryId===catId&&t.subId===subId){t.categoryId=sub.id;t.subId=null;}});state.planned.forEach(p=>{if(p.categoryId===catId&&p.subId===subId){p.categoryId=sub.id;p.subId=null;}});save();render();toast('Convertida en categoría principal');}

/* v33 · Datos de ejemplo (marcados demo:true para poder reiniciarlos) */
function loadDemoData(){
  let s=20260101;const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let x=Math.imul(s^s>>>15,1|s);x=x+Math.imul(x^x>>>7,61|x)^x;return((x^x>>>14)>>>0)/4294967296;};
  const r2=v=>Math.round(v*100)/100,T=today(),base=parseISO(T);
  const fmtD=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  const acc={id:uid(),name:'Cuenta corriente',type:'checking',balance:1800,color:'#007AFF',icon:'🏦',enabled:true,demo:true};
  const sav={id:uid(),name:'Ahorros',type:'savings',balance:5000,color:'#34C759',icon:'💰',enabled:true,demo:true};
  const cash={id:uid(),name:'Efectivo',type:'cash',balance:650,color:'#FF9500',icon:'💵',enabled:true,demo:true};
  const card={id:uid(),name:'Visa Demo',limit:3000,cutoffDay:20,paymentDay:5,deferredFee:0,color:'#5856D6',demo:true};
  state.accounts.push(acc,sav,cash);state.cards.push(card);
  const add=(ds,type,cat,sub,amount,note,pay,bill)=>{
    const o={id:uid(),date:ds,type,categoryId:cat,subId:sub||null,amount:r2(amount),note,accountId:pay==='card'?null:(pay||acc.id),cardId:pay==='card'?card.id:null,demo:true};
    if(bill?ds>=T:ds>T){o.done=false;state.planned.push(o);}else if(ds<=T){o.fee=0;state.transactions.push(o);}
  };
  const pagoTC=(ds,amount)=>{const o={id:uid(),date:ds,type:'transfer',accountId:acc.id,toCardId:card.id,amount:r2(amount),fee:0,note:'Pago tarjeta '+card.name,demo:true};if(ds>=T){o.done=false;state.planned.push(o);}else state.transactions.push(o);};
  for(let k=-150;k<=120;k++){
    const d=new Date(base);d.setDate(d.getDate()+k);const ds=fmtD(d),dom=d.getDate(),dow=d.getDay(),mo=d.getMonth();
    if(dom===1)add(ds,'income','sueldo',null,2600,'Sueldo mensual',acc.id,true);
    if(dom===18&&mo%2===0)add(ds,'income','freelance',null,350+rnd()*250,'Proyecto freelance',acc.id,true);
    if(dom===5){add(ds,'expense','hogar','alq',650,'Alquiler',acc.id,true);pagoTC(ds,250+rnd()*50);}
    if(dom===8)add(ds,'expense','servicios','int',35,'Internet',acc.id,true);
    if(dom===12){add(ds,'expense','servicios','luz',38+rnd()*20,'Luz',acc.id,true);add(ds,'expense','servicios','agua',18,'Agua',acc.id,true);}
    if(dom===15)add(ds,'expense','ocio','stream',14.99,'Streaming','card',true);
    if(k>0)continue;
    if(dow===6)add(ds,'expense','comida','super',45+rnd()*50,'Supermercado',rnd()<.5?'card':acc.id);
    if(dow===5&&rnd()<.6)add(ds,'expense','comida','resto',18+rnd()*30,'Restaurante',rnd()<.5?'card':acc.id);
    if(dow>0&&dow<6&&rnd()<.4)add(ds,'expense','comida','cafe',3.5+rnd()*3,'Café',cash.id);
    if(dom%10===3)add(ds,'expense','transporte','gas',25+rnd()*15,'Gasolina',acc.id);

function subBusinessDays(d,n){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());let k=0;while(k<n){x.setDate(x.getDate()-1);const w=x.getDay();if(w!==0&&w!==6)k++;}return x;}

function v38Migrate(){const rep={removed:[],kept:[],loans:[],budgets:[],reassigned:0,transfersCleared:0};
  splitTransferFeesOnce();const before=v38Snap();const oldC=state.categories;const tree=v38BuildTree();
  /* 1. traspasos "por cuadrar": se eliminan y el saldo inicial compensa el efecto */
  const cuad=new Set([...(oldC.expense||[]),...(oldC.income||[])].filter(c=>v38n(c.name).includes('por cuadrar')).map(c=>c.id));
  state.transactions=state.transactions.filter(t=>{if(!cuad.has(t.categoryId)||t.type==='transfer')return true;const amt=(Number(t.amount)||0)+(Number(t.fee)||0);
    if(t.accountId){const a=getAccount(t.accountId);if(a){const d=t.type==='income'?amt:-amt;a.balance=r2((Number(a.balance)||0)+d);if(a.opening!=null)a.opening=r2((Number(a.opening)||0)+d);}}
    else if(t.cardId&&t.type==='expense'){const c=getCard(t.cardId);if(c)c.opening=r2((Number(c.opening)||0)+amt);}
    rep.removed.push({date:t.date,note:t.note,amount:amt,type:t.type,where:t.accountId?(getAccount(t.accountId)||{}).name:(getCard(t.cardId)||{}).name});return false;});
  state.planned=state.planned.filter(p=>!(cuad.has(p.categoryId)&&p.type!=='transfer'));
  /* 2. mapa de categorías antiguas -> grupo / subcategoría */
  const maps={expense:{},income:{}},subMaps={expense:{},income:{}},keep={expense:[],income:[]};
  ['expense','income'].forEach(type=>{(oldC[type]||[]).forEach(c=>{const nm=v38n(c.name);if(nm.includes('por cuadrar')||nm==='pago de tarjeta'){maps[type][c.id]='drop';return;}
    let hit=null;for(const g of tree[type]){const s=g.subs.find(x=>x._names.includes(nm));if(s){hit={g,s};break;}}
    if(!hit){keep[type].push(c);rep.kept.push(c.name);return;}
    hit.s.budget=(Number(hit.s.budget)||0)+(Number(c.budget)||0);maps[type][c.id]={c:hit.g.id,s:hit.s.id};
    (c.subs||[]).forEach(os=>{if(!os||!os.id)return;hit.g.subs.push({id:os.id,name:os.name,icon:os.icon||'🏷️',budget:Number(os.budget)||0});subMaps[type][os.id]={c:hit.g.id,s:os.id};});});});
  ['expense','income'].forEach(t=>tree[t].forEach(g=>g.subs.forEach(s=>delete s._names)));
  state.categories={expense:[...tree.expense,...keep.expense],income:[...tree.income,...keep.income]};
  state.settings.expenseFallbackId='g_finanzas';state.settings.incomeFallbackId='gi_otros';
  /* 3. reasignar movimientos, planificados y diferidos */
  const FB={expense:{c:'g_finanzas',s:'s_otros_gastos'},income:{c:'gi_otros',s:'si_otros'}};
  const fix=o=>{if(o.type==='transfer'){if(o.categoryId||o.subId){rep.transfersCleared++;}delete o.categoryId;delete o.subId;return;}
    const type=o.type==='income'?'income':'expense';
    if(o.loanId){const l=state.loans.find(x=>x.id===o.loanId);if(l&&type==='expense'&&!o.loanPart){const lc=loanCat(l);o.categoryId=lc.categoryId;o.subId=lc.subId;rep.reassigned++;return;}}
    let t=(o.subId&&subMaps[type][o.subId])||maps[type][o.categoryId];if(t==='drop')t=FB[type];if(!t)return;
    o.categoryId=t.c;o.subId=t.s;rep.reassigned++;
    if(type==='expense'&&t.s==='s_otros_gastos'&&/compras varias|^varios$|riocentro/i.test(o.note||'')){o.categoryId='g_compras';o.subId='s_otras_compras';}};
  state.transactions.forEach(fix);state.planned.forEach(fix);state.deferreds.forEach(d=>{const t=maps.expense[d.categoryId];if(t&&t!=='drop'){d.categoryId=t.c;d.subId=t.s;}else if(t==='drop'){d.categoryId=FB.expense.c;d.subId=FB.expense.s;}});
  /* 4. préstamos: costos como seguros + cuotas ya pagadas partidas */
  state.loans.forEach(l=>v38UpgradeLoan(l,rep));

  state.categories.expense.forEach(g=>(g.subs||[]).forEach(s=>{if((Number(s.budget)||0)===0){const avg=catAvgMonth('expense',g.id,s.id);if(avg>=1){s.budget=Math.round(avg);rep.budgets.push({name:g.name+' › '+s.name,value:s.budget});}}}));
  state.settings.v38Done=true;

  ${rep.loans.map(l=>`<li>Préstamo "${escapeHtml(l.name)}": ${l.costs.length?'costos → '+l.costs.map(escapeHtml).join(', '):'sin costos'}; ${l.split} cuota(s) pagada(s) partida(s) en movimientos; cuenta de pago: ${escapeHtml(l.account||'—')}.</li>`).join('')}

  <div style="font-size:var(--fs-xs);color:var(--muted);margin-top:var(--sp-3)">Se descargó antes una copia de seguridad con tus datos anteriores.</div></div>`;}
function v38Run(){if(state.settings.v38Done){toast('La estructura V38 ya está aplicada');return;}
  if(!confirm('Se descargará una copia de seguridad de tus datos actuales y luego se reorganizarán las categorías, los seguros de los préstamos y los saldos iniciales. Los saldos no deben cambiar (verás un informe). ¿Continuar?'))return;

/* ============ v40 · TARJETAS: estados de cuenta, diferidos por compra, gráfico de pagos y pago planificado ============ */
/* Esta versión NO lleva datos personales: los estados de cuenta (state.statements), las fechas de compra de los diferidos (origDate), las reclasificaciones (reclassCredit/reclassDate) y las referencias del banco (settings.v40Ref) viajan en el respaldo. */
const V40_CUOTA_RE=/^Cuota\s+(\d+)\/(\d+)\s+de\s+\$([\d.,]+)\/\$([\d.,]+)/i;
const v40Day=(y,m,d)=>Math.min(d,new Date(y,m+1,0).getDate());
/* corte/pago con "día 29-31 = último día del mes" */
function cardCutFor(card,iso){const d=parseISO(iso);const y=d.getFullYear(),m=d.getMonth();const k=new Date(y,m,v40Day(y,m,card.cutoffDay));return d<k?k:new Date(y,m+1,v40Day(y,m+1,card.cutoffDay));}
function cardPayFor(card,K){const y=K.getFullYear(),m=K.getMonth()+(card.paymentDay<=card.cutoffDay?1:0);const yy=new Date(y,m,1);return new Date(yy.getFullYear(),yy.getMonth(),v40Day(yy.getFullYear(),yy.getMonth(),card.paymentDay));}
function nextCutoff(card,from=new Date()){const y=from.getFullYear(),m=from.getMonth();let d=new Date(y,m,v40Day(y,m,card.cutoffDay));if(d<=from)d=new Date(y,m+1,v40Day(y,m+1,card.cutoffDay));return d;}
function nextPaymentDate(card){const cut=nextCutoff(card);return cardPayFor(card,cut);}
const v40IsFin=t=>t.type==='expense'&&/inter[eé]s|mora/i.test(t.note||'')&&t.subId==='s_cargos_tc';
const v40IsLegacyCuota=t=>!!((t.installmentN||t.installmentNumber)&&!t.v40Purchase)||V40_CUOTA_RE.test(t.note||'');
const v40IsConsumo=t=>t.type==='expense'&&!!t.cardId&&!v40IsFin(t)&&!v40IsLegacyCuota(t);
function v40CutRows(card){const off=(state.statements||[]).filter(s=>s.cardId===card.id).map(s=>({cardId:card.id,id:s.id,cut:s.cut,due:s.due,total:Number(s.total)||0,min:Number(s.min)||0,carry:Number(s.carry)||0,defer:Number(s.defer)||0,util:s.util,official:true})).sort((a,b)=>a.cut<b.cut?-1:1);
  const rows=off.slice();let y,m;if(off.length){const l=parseISO(off[off.length-1].cut);y=l.getFullYear();m=l.getMonth()+1;}else{const t=new Date();y=t.getFullYear();m=t.getMonth()-6;}
  for(let i=0;i<16;i++){const d=new Date(y,m+i,1);const cd=new Date(d.getFullYear(),d.getMonth(),v40Day(d.getFullYear(),d.getMonth(),card.cutoffDay));const cut=isoOf(cd);if(rows.length&&cut<=rows[rows.length-1].cut)continue;rows.push({cardId:card.id,cut,due:isoOf(cardPayFor(card,cd)),official:false});}
  return rows;}
/* calendario de cuotas de un diferido: cada cuota entra en el estado de cuenta cuyo corte es ≥ a su 1.ª fecha */
function v40Sched(d,rows){const card=getCard(d.cardId);if(!card)return [];rows=rows||v40CutRows(card);let i=rows.findIndex(r=>r.cut>=d.startDate);if(i<0)i=rows.length;const n=d.installments;const out=[];
  for(let k=0;k<n;k++){const r=rows[i+k];const amt=(k===n-1)?r2(d.total-d.monthly*(n-1)):d.monthly;out.push({n:k+1,amount:amt,cut:r?r.cut:'9999-12-31',due:r?r.due:null});}return out;}
function v40Stmts(card){const rows=v40CutRows(card);const tk=today();let prev=null;
  const tx=state.transactions.filter(t=>t.cardId===card.id&&t.type==='expense');const refunds=state.transactions.filter(t=>t.type==='transfer'&&t.toCardId===card.id&&!t.accountId);
  const pays=state.transactions.filter(t=>t.type==='transfer'&&t.toCardId===card.id&&t.accountId);const plans=state.planned.filter(p=>!p.done&&p.type==='transfer'&&p.toCardId===card.id);
  const defs=state.deferreds.filter(d=>d.cardId===card.id&&d.v40).map(d=>v40Sched(d,rows));
  rows.forEach((r,i)=>{const nextCut=rows[i+1]?rows[i+1].cut:addMonths(r.cut,1);r.prevCut=prev?prev.cut:'0000-00-00';r.nextCut=nextCut;
    r.paid=r2(pays.filter(t=>t.date>=r.cut&&t.date<nextCut).reduce((s,t)=>s+t.amount,0));r.planned=r2(plans.filter(p=>p.date>=tk&&p.date>=r.cut&&p.date<nextCut).reduce((s,p)=>s+p.amount,0));r.estOnly=0;
    if(!r.official){const unpaid=prev?Math.max(prev.total-prev.paid-prev.planned,0):0;const win=tx.filter(t=>t.date>r.prevCut&&t.date<=r.cut);const finReal=win.filter(v40IsFin).reduce((s,t)=>s+t.amount,0);
      const days=prev?Math.max(1,daysBetween(parseISO(prev.cut),parseISO(r.cut))):30;const intEst=(r.cut>tk&&unpaid>0)?unpaid*(Number(card.apr)||0)/100*days/365:0;
      r.carry=r2(unpaid+Math.max(finReal,intEst));r.estOnly=r2(Math.max(intEst-finReal,0));const cons=win.filter(t=>!v40IsFin(t)&&!t.v40Purchase&&!v40IsLegacyCuota(t)).reduce((s,t)=>s+t.amount,0);
      const ref=refunds.filter(t=>t.date>r.prevCut&&t.date<=r.cut).reduce((s,t)=>s+t.amount,0);
      r.defer=r2(defs.reduce((s,sc)=>s+sc.filter(q=>q.cut===r.cut).reduce((a,q)=>a+q.amount,0),0));r.current=r2(Math.max(cons-ref,0));r.total=r2(r.carry+r.current+r.defer);}
    else r.current=r2(r.total-r.carry-r.defer);
    r.remaining=r2(r.total-r.paid);prev=r;});
  return rows;}
function cardBalanceAt(id,iso){const c=getCard(id);let b=Number(c&&c.opening)||0;state.transactions.forEach(t=>{if(iso&&t.date>iso)return;if(t.cardId===id&&t.type==='expense')b+=t.amount;if(t.type==='transfer'&&t.toCardId===id)b-=t.amount;});return r2(b);}
const __cardBalanceV37=cardBalance;
cardBalance=function(id){if(state.settings.v40Done)return cardBalanceAt(id);return __cardBalanceV37(id);};
const __postDueV37=postDueInstallments;
postDueInstallments=function(){if(state.settings.v40Done)return false;return __postDueV37();};
/* ---- deferido nuevo: la compra cuenta completa; las cuotas solo son calendario de pago ---- */
function applyDefer(t,n,feePct,D){const card=getCard(t.cardId);const p=deferPlan(t.amount,n,feePct);const did=uid();const K=cardCutFor(card,t.date);const first=D>=isoOf(K)?D:t.date;const extra=r2(p.fee*n);
  state.deferreds.push({id:did,cardId:t.cardId,note:t.note,total:r2(p.cuota*n),installments:n,monthly:r2(p.cuota),startDate:first,categoryId:t.categoryId,subId:t.subId||null,paid:0,fee:feePct,principal:t.amount,feeAmt:r2(p.fee),txId:t.id,origDate:t.date,origAmount:t.amount,v40:true});
  t.deferredId=did;t.installments=n;t.v40Purchase=true;
  if(extra>0)state.transactions.push({id:uid(),date:first,type:'expense',categoryId:'g_finanzas',subId:'s_cargos_tc',cardId:t.cardId,accountId:null,amount:extra,fee:0,note:`Intereses por diferir · ${t.note||''}`,deferFeeOf:did});

function undoDefer(txId){const t=state.transactions.find(x=>x.id===txId);if(!t||!t.deferredId)return;if(!confirm('¿Deshacer el diferido? El consumo queda como pago corriente.'))return;const did=t.deferredId;
  state.transactions=state.transactions.filter(x=>x.deferFeeOf!==did);state.planned=state.planned.filter(p=>p.fromDeferred!==did);state.deferreds=state.deferreds.filter(x=>x.id!==did);['installments','deferredId','v40Purchase'].forEach(k=>delete t[k]);save();render();toast('Diferido deshecho');}
/* ---- diferidos activos: calendario de cuotas por estado de cuenta ---- */
function defersPanelHTML(c){const rows=v40CutRows(c);const tk=today();const act=state.deferreds.filter(d=>d.cardId===c.id&&d.v40&&!d.reclass||d.cardId===c.id&&d.v40&&d.reclass).map(d=>({d,s:v40Sched(d,rows)})).filter(x=>x.s.some(q=>q.cut>tk));if(!act.length)return '';

  return `<div class="panel" style="margin-bottom:var(--sp-3)"><div class="panel__head"><div><div class="panel__title">Diferidos activos</div><div class="panel__sub">${act.length} · toca un consumo para ver sus cuotas</div></div></div><div class="def-list">${items}</div></div>`;}
/* ---- próximos pagos: según el estado de cuenta, no el saldo ---- */
function upcomingCardPayments(){const tk=today();return state.cards.map(c=>{const rows=v40Stmts(c);let r=rows.find(s=>s.due>=tk&&s.remaining>0.005)||rows.find(s=>s.cut>tk)||rows[rows.length-1];
  const pay=r?parseISO(r.due):nextPaymentDate(c);const cut=r?parseISO(r.cut):nextCutoff(c);return {card:c,pay,cut,days:daysBetween(new Date(),pay),balance:r?Math.max(r.remaining,0):Math.max(cardBalance(c.id),0)};}).sort((a,b)=>a.pay-b.pay);}
/* ---- gráfico: Pagos · Consumos · A pagar ---- */
const V40_SER=[['pago','Pago realizado','#34C759','solid'],['esp','Pago esperado (falta)','#34C759','hatch'],['cons','Consumos del mes · en el corte','#FF3B30','solid'],['consx','Consumos del mes · fuera del corte','#FF3B30','hatch'],['corr','Consumos a pagar','#FF9500','solid'],['dif','Diferidos a pagar','#FFCC00','soft'],['arr','Monto arrastrado','#FF3B30','cross']];
function v40ChartData(months,ids){const idx={};months.forEach((m,i)=>{idx[m.key]=i;});const out=months.map(()=>({pago:0,esp:0,cons:0,consx:0,corr:0,dif:0,arr:0}));const cutsBy={};ids.forEach(id=>{const card=getCard(id);if(!card)return;const o={};v40Stmts(card).forEach(s=>{o[(s.cut||'').slice(0,7)]=s.cut;});cutsBy[id]=o;});

function v40SyncCardPayments(){if(!state.settings.v40Done)return;const tk=today();const limit=addMonths(tk,3);
  state.deferreds.forEach(d=>{if(d.v40){const n=v40Sched(d).filter(q=>q.cut<=tk).length;d.paid=Math.min(d.installments,n);}});

      const rows=v40Stmts(card);let lastIssued=-1;rows.forEach((s,i)=>{if(s.cut<=tk)lastIssued=i;});const want={};
      rows.forEach((s,i)=>{if(!((i===lastIssued&&s.due>=tk)||(i>lastIssued&&s.due<=limit)))return;if(s.remaining<=0.005)return;want[s.cut]=s;});
      const mine=state.planned.filter(p=>p.autoPay&&p.toCardId===card.id);
      Object.keys(want).forEach(cut=>{const s=want[cut];const manual=state.planned.some(p=>!p.autoPay&&!p.done&&p.type==='transfer'&&p.toCardId===card.id&&p.date>=s.cut&&p.date<s.nextCut);if(manual)return;

      const keep=new Set(Object.keys(want));const before=state.planned.length;state.planned=state.planned.filter(p=>!(p.autoPay&&p.toCardId===card.id&&!keep.has(p.stmtCut)));if(state.planned.length!==before)changed=true;});
    if(!changed)break;}}
